<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายชื่อผู้ใช้งาน TIS</title>
  <style>
:root { --bg:#f4f7fb; --text:#1f2937; --muted:#6b7280; --primary:#0f766e; --primary-dark:#115e59; --line:#e5e7eb; --soft:#ecfeff; --shadow:0 18px 45px rgba(15,23,42,.10); }
* { box-sizing:border-box; }
body { margin:0; font-family:"Segoe UI", Tahoma, Arial, sans-serif; background:radial-gradient(circle at top left, rgba(20,184,166,.20), transparent 28rem), linear-gradient(135deg,#eef7ff 0%,var(--bg) 48%,#f8fafc 100%); color:var(--text); min-height:100vh; padding:28px; }
.page { max-width:1280px; margin:0 auto; }
.hero { display:grid; grid-template-columns:1.5fr 1fr; gap:18px; align-items:stretch; margin-bottom:22px; }
.title-card,.stat-card,.table-card { background:rgba(255,255,255,.88); border:1px solid rgba(255,255,255,.75); border-radius:24px; box-shadow:var(--shadow); backdrop-filter:blur(12px); }
.title-card { padding:28px; overflow:hidden; position:relative; }
.title-card::after { content:""; position:absolute; width:220px; height:220px; right:-70px; top:-90px; background:linear-gradient(135deg, rgba(20,184,166,.22), rgba(59,130,246,.18)); border-radius:999px; }
.badge { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:var(--soft); color:var(--primary-dark); font-weight:700; font-size:13px; margin-bottom:14px; }
h1 { margin:0; font-size:clamp(28px,4vw,44px); line-height:1.1; letter-spacing:-.03em; }
.subtitle { margin:12px 0 0; color:var(--muted); font-size:16px; max-width:680px; }
.stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.stat-card { padding:22px; } .stat-label { color:var(--muted); font-size:13px; margin-bottom:7px; } .stat-value { font-size:30px; font-weight:800; color:var(--primary-dark); }
.toolbar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
.search,.select { border:1px solid var(--line); background:#fff; border-radius:16px; padding:13px 15px; font-size:15px; outline:none; box-shadow:0 8px 22px rgba(15,23,42,.05); } .search { flex:1 1 320px; } .select { flex:0 1 240px; cursor:pointer; }
.table-card { overflow:hidden; } .table-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px; border-bottom:1px solid var(--line); } .table-head h2 { margin:0; font-size:19px; } .count { color:var(--muted); font-size:14px; }
.table-wrap { overflow:auto; max-height:70vh; } table { width:100%; border-collapse:collapse; min-width:920px; }
thead th { position:sticky; top:0; z-index:1; background:#f8fafc; color:#334155; text-align:left; font-size:13px; letter-spacing:.02em; padding:14px 16px; border-bottom:1px solid var(--line); white-space:nowrap; }
tbody td { padding:13px 16px; border-bottom:1px solid #eef2f7; vertical-align:middle; font-size:14px; } tbody tr:hover { background:#f0fdfa; }
.user-pill { display:inline-flex; align-items:center; padding:7px 10px; border-radius:999px; background:#ecfdf5; color:#047857; font-weight:700; font-family:Consolas, Monaco, monospace; font-size:13px; white-space:nowrap; }
.phone { font-family:Consolas, Monaco, monospace; white-space:nowrap; } .position { display:inline-block; padding:6px 10px; border-radius:999px; background:#eff6ff; color:#1d4ed8; font-size:13px; font-weight:700; white-space:nowrap; }
.empty { display:none; padding:38px; text-align:center; color:var(--muted); }
@media (max-width:860px) { body { padding:16px; } .hero { grid-template-columns:1fr; } .stats { grid-template-columns:1fr 1fr; } .title-card,.stat-card { border-radius:20px; } }
</style>
</head>

    </section>

    const tableBody = document.getElementById("tableBody");
    const searchInput = document.getElementById("searchInput");
    const positionFilter = document.getElementById("positionFilter");
    const totalCount = document.getElementById("totalCount");
    const shownCount = document.getElementById("shownCount");
    const resultText = document.getElementById("resultText");
    const emptyState = document.getElementById("emptyState");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      }[char]));
    }


    function maskPhone(phone) {
      const value = String(phone || "").replace(/\D/g, "");
      if (value.length <= 7) return escapeHtml(phone || "");
      return `${value.slice(0, 3)}***${value.slice(-4)}`;
    }

    function setupPositions() {
      const positions = [...new Set(people.map(item => item.position).filter(Boolean))].sort((a, b) => a.localeCompare(b, "th"));
      positions.forEach(position => {
        const option = document.createElement("option");
        option.value = position;
        option.textContent = position;
        positionFilter.appendChild(option);
      });
    }

    function render() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedPosition = positionFilter.value;
      const filtered = people.filter(item => {
        const text = `${item.thai} ${item.eng} ${item.phone} ${item.position} ${item.user}`.toLowerCase();
        return (!keyword || text.includes(keyword)) && (!selectedPosition || item.position === selectedPosition);
      });

      tableBody.innerHTML = filtered.map((item, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(item.thai)}</td>
          <td>${escapeHtml(item.eng)}</td>
          <td class="phone">${maskPhone(item.phone)}</td>
          <td><span class="position">${escapeHtml(item.position || "-")}</span></td>
          <td><span class="user-pill">${escapeHtml(item.user || "-")}</span></td>
        </tr>`).join("");
      totalCount.textContent = people.length.toLocaleString("th-TH");
      shownCount.textContent = filtered.length.toLocaleString("th-TH");
      resultText.textContent = `TIS • แสดง ${filtered.length.toLocaleString("th-TH")} จาก ${people.length.toLocaleString("th-TH")} รายการ`;
      emptyState.style.display = filtered.length ? "none" : "block";
    }

    searchInput.addEventListener("input", render);
    positionFilter.addEventListener("change", render);
    setupPositions();
    render();
  </script>
